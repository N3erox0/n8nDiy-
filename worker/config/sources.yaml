# 订阅源（方案附录 A / B）。改这里不用重启，下一场采集自动生效。
# method:
#   rss        直接读 RSS/Atom
#   rsshub     走本机 RSSHub 路由（route）
#   x          不登录 X：Bing 网页搜索 site:x.com/<handle>，帖子时间用 ID 换算
#   kw_bing    关键词：Bing 网页搜索 RSS（本机结果大多没有发布时间，已不用）
#   kw_gnews   关键词：Google News RSS（带发布时间，跳转链接自动还原成原文链接）
#   kw_hn      关键词：hnrss.org 搜索
#   wechat2rss Wechat2RSS 免费清单
#   page       没有 RSS 的官网列表页：按 link_pattern 找文章链接，逐篇抓时间
#   none       暂无订阅方式（只计入失败统计，阶段 2 补）
# official: true 表示一手信源（官网、官方账号、当事人）

exclude_words: [网络安全, 漏洞, 攻击, 合规, 监管, 立法, 隐私]

groups:
  G1: {name: 官方与英文, early: "06:30", late: "16:30", timeout_min: 15}
  G2: {name: 关键词与X, early: "06:45", late: "16:45", timeout_min: 15}
  G3: {name: 媒体与公众号, early: "07:00", late: "17:00", timeout_min: 15}

sources:
